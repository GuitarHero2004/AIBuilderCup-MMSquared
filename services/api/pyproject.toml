[project]
name = "greenprocure-api"
version = "0.1.0"
description = "GreenProcure owner-scoped case foundation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.142.2",
  "firebase-admin==7.7.0",
  "google-cloud-firestore==2.34.0",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "uvicorn==0.54.0",
]

[dependency-groups]
dev = ["httpx==0.28.1", "pytest==9.1.1", "ruff==0.16.10"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
  "integration: opt-in Firebase Auth and Firestore emulator integration",
  "live: opt-in read-only smoke checks against a configured deployed API",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
